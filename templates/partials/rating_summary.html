<a href="#reviews" class="rating-summary-link" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
  <span class="rv-stars" aria-hidden="true">
    {% for s in stats.stars %}{% if s == 'full' %}<i class="fas fa-star"></i>{% elif s == 'half' %}<i class="fas fa-star-half-stroke"></i>{% else %}<i class="far fa-star"></i>{% endif %}{% endfor %}
  </span>
  {% if stats.total %}
  <span style="font-weight:700;color:#2b2b2b;font-size:14px;">{{ stats.average }}</span>
  <span class="text-muted" style="font-size:13px;">({{ stats.total }} review{{ stats.total|pluralize }})</span>
  {% else %}
  <span class="text-muted" style="font-size:13px;">No reviews yet</span>
  {% endif %}
</a>
<style>
.rv-stars { color: #E0A82E; letter-spacing: 1px; font-size: 14px; }
</style>
