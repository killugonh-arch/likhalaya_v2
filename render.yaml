services:
  - type: web
    name: likhalaya
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn likhalaya_project.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_BEHIND_PROXY
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: likhalaya-db
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GCASH_ACCOUNT_NAME
        sync: false
      - key: GCASH_ACCOUNT_NUMBER
        sync: false
      - key: MESSAGE_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: likhalaya-db
    plan: free